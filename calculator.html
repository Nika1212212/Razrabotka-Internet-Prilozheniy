<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Яндекс.Калькулятор — Лабораторная работа №2</title>
  <!-- Подключение каскадных таблиц стилей из ЛР1 (Пункт 6 методички) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Задание 19: Поле с целью ЛР и подсветкой ключевых слов через тег <mark> -->
  <div class="yandex-info-box">
    <p><strong>Цель работы:</strong> <mark>знакомство</mark> с инструментами построения пользовательских интерфейсов веб-сайтов: <mark>HTML</mark>, <mark>CSS</mark>, JavaScript.</p>
  </div>

  <!-- Задание 12: Кнопка-интерфейс для смены темы оформления (цвета фона) -->
  <div class="theme-toggle-wrapper">
    <label class="yandex-switch">
      <input type="checkbox" id="theme-switch">
      <span class="slider"></span>
    </label>
    <span>Ночной режим Яндекса</span>
  </div>

  <!-- Главный контейнер (Задание 10 - центрирование, Задание 20 - стилистика Яндекса) -->
  <div class="yandex-calc-card">
    
    <!-- Дисплей строки ввода поисковика (Задания 4, 5, 6, 11, 13) -->
    <div id="result" class="search-bar-display">0</div>

    <!-- Кнопочная сетка плиток (Задание 3: Квадратные; Задание 7: Жирный шрифт; Задание 1: Палитра Яндекса) -->
    <!-- РЯД 1: Очистка, полный сброс, проценты и деление -->
    <div class="grid-row">
      <button id="btn_op_clear" class="my-btn secondary">C</button>
      <button id="btn_op_clear_all" class="my-btn secondary">AC</button>
      <button id="btn_op_percent" class="my-btn secondary">%</button>
      <button id="btn_op_div" class="my-btn secondary">/</button>
    </div>

    <!-- РЯД 2: Блок 7-9 и умножение -->
    <div class="grid-row">
      <button id="btn_digit_7" class="my-btn">7</button>
      <button id="btn_digit_8" class="my-btn">8</button>
      <button id="btn_digit_9" class="my-btn">9</button>
      <button id="btn_op_mult" class="my-btn secondary">x</button>
    </div>

    <!-- РЯД 3: Блок 4-6 и вычитание -->
    <div class="grid-row">
      <button id="btn_digit_4" class="my-btn">4</button>
      <button id="btn_digit_5" class="my-btn">5</button>
      <button id="btn_digit_6" class="my-btn">6</button>
      <button id="btn_op_minus" class="my-btn secondary">-</button>
    </div>

    <!-- РЯД 4: Блок 1-3 и сложение -->
    <div class="grid-row">
      <button id="btn_digit_1" class="my-btn">1</button>
      <button id="btn_digit_2" class="my-btn">2</button>
      <button id="btn_digit_3" class="my-btn">3</button>
      <button id="btn_op_plus" class="my-btn secondary">+</button>
    </div>

    <!-- РЯД 5: Ввод 000, 0, разделитель и операция квадратного корня (Задание 5 к ЛР2) -->
    <div class="grid-row">
      <button id="btn_digit_000" class="my-btn">000</button>
      <button id="btn_digit_0" class="my-btn">0</button>
      <button id="btn_digit_dot" class="my-btn">.</button>
      <button id="btn_op_sqrt" class="my-btn MathOp">√</button>
    </div>

    <!-- РЯД 6: Возведение в квадрат, факториал и большая алая кнопка равенства Яндекса -->
    <div class="grid-row">
      <button id="btn_op_fact" class="my-btn MathOp">x!</button>
      <button id="btn_op_sqr" class="my-btn MathOp">x²</button>
      <button id="btn_op_equal" class="my-btn primary execute">=</button>
    </div>

    <!-- Дополнительные элементы из ЛР1 -->
    <div class="yandex-addons-panel">
      <!-- Задание 17: Поле с выпадающим списком -->
      <select class="yandex-select">
        <option value="standard">Стандартный калькулятор</option>
        <option value="currency">Яндекс.Конвертер валют</option>
        <option value="engineering">Инженерный режим</option>
      </select>

      <!-- Задание 18: Сворачивающиеся подробности -->
      <details class="yandex-details">
        <summary>Автор проекта</summary>
        <p>ФИО: Горбунова В.С.<br>Группа: ИБМ3-54Б</p>
      </details>

      <!-- Задание 16: Кнопка-ссылка на ваш персональный рабочий репозиторий -->
      <a href="https://github.com" target="_blank" class="yandex-github-btn">Открыть репозиторий GitHub</a>
    </div>
  </div>

  <!-- Задание 9: Текст подвала -->
  <div class="yandex-footer">
    ЛР выполнена Горбунова В.С.
  </div>

  <!-- Подключение динамической логики JavaScript (Пункт 1 плана) -->
  <script src="script.js"></script>
</body>
</html>
